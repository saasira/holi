<template id="sqleditor-template">
    <section class="holi-sqleditor">
        <div class="holi-sqleditor-toolbar" data-role="toolbar">
            <button type="button" class="holi-sqleditor-run" data-action="run">Run</button>
            <span class="holi-sqleditor-hint" id="sqleditor-hint" data-role="hint">Ctrl+Enter runs the selection, or all of it</span>
            <slot name="actions"></slot>
        </div>
        <div class="holi-sqleditor-surface" data-role="surface">
            <pre class="holi-sqleditor-highlight" data-role="highlight" aria-hidden="true"></pre>
            <textarea class="holi-sqleditor-input" data-role="input" spellcheck="false" wrap="off" autocomplete="off" autocapitalize="off"
                      aria-label="SQL" aria-describedby="sqleditor-hint" aria-autocomplete="list"></textarea>
            <ul class="holi-sqleditor-suggest" data-role="suggest" role="listbox" aria-label="Suggestions" hidden></ul>
        </div>
        <ul class="holi-sqleditor-params" data-role="params" aria-label="Query parameters"></ul>
    </section>
</template>

<template id="sqleditor-param-template">
    <li class="holi-sqleditor-param" data-param="@{item.name}">
        <label class="holi-sqleditor-param-name">
            <span>:@{item.name}</span>
            <input type="text" class="holi-sqleditor-param-value" data-role="param-value" data-param="@{item.name}" value="@{item.value}" placeholder="value">
        </label>
        <select class="holi-sqleditor-param-type" data-role="param-type" data-param="@{item.name}" aria-label="Type of @{item.name}">
            <option value="text">text</option>
            <option value="number">number</option>
            <option value="date">date</option>
        </select>
    </li>
</template>

<template id="sqleditor-suggest-item-template">
    <li class="holi-sqleditor-suggest-item" role="option" data-index="@{item.index}" aria-selected="false">
        <span class="holi-sqleditor-suggest-label">@{item.label}</span>
        <small class="holi-sqleditor-suggest-kind">@{item.kind}</small>
    </li>
</template>
