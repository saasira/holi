<template id="page-layout-10x2" data-layout="10x2">
    <section class="holi-page-layout holi-page-layout-10x2">
        <header class="holi-page-band holi-page-band-header">
            <slot name="header"></slot>
        </header>
        <section class="holi-page-band holi-page-band-postheader">
            <slot name="postheader"></slot>
        </section>
        <section class="holi-page-band holi-page-band-body">
            <main class="holi-page-band holi-page-band-main">
                <slot name="main"></slot>
            </main>
            <aside class="holi-page-sidebar holi-page-sidebar-rsb" data-sidebar="rsb" data-sidebar-mode="fixed">
                <slot name="rsb-fixed"></slot>
            </aside>
            <drawer class="holi-page-sidebar-drawer holi-page-sidebar-drawer-rsb" data-sidebar="rsb" data-sidebar-mode="drawer" direction="right" max-size="360px" trigger-label="Tools">
                <header slot="header">Tools</header>
                <slot name="rsb-drawer"></slot>
            </drawer>
        </section>
        <section class="holi-page-band holi-page-band-prefooter">
            <slot name="prefooter"></slot>
        </section>
        <footer class="holi-page-band holi-page-band-footer">
            <slot name="footer"></slot>
        </footer>
        <section class="holi-page-band holi-page-band-dialog">
            <slot name="dialog"></slot>
        </section>
    </section>
</template>
