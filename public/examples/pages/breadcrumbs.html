<!doctype html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Breadcrumbs Example</title>
        <link rel="stylesheet" href="/dist/holi.css">
        <script src="/dist/holi.js"></script>
        <style>
            body { font-family: Segoe UI, sans-serif; margin: 20px; }
            .demo { margin-bottom: 20px; }
            .demo h2 { margin: 0 0 8px; font-size: 18px; }
            .panel { border: 1px solid #d6dde8; border-radius: 10px; padding: 12px; background: #f8fafc; }
            .note { margin: 0 0 10px; color: #334155; font-size: 13px; }
            code { background: #e2e8f0; border-radius: 4px; padding: 1px 4px; }
        </style>
    </head>
    <body>
        <h1>Breadcrumbs Variants</h1>
        <p class="note">
            Each variant reads the component-local <code>crumbs</code> array, generated from the current URL path.
            For this page, the source path is <code>/examples/pages/breadcrumbs.html</code>.
        </p>

        <section class="demo">
            <h2>Variant 1: component="breadcrumbs"</h2>
            <div class="panel">
                <section component="breadcrumbs"></section>
            </div>
        </section>

        <section class="demo">
            <h2>Variant 2: role="breadcrumbs"</h2>
            <div class="panel">
                <section role="breadcrumbs"></section>
            </div>
        </section>

        <section class="demo">
            <h2>Variant 3: &lt;breadcrumbs&gt;</h2>
            <div class="panel">
                <breadcrumbs></breadcrumbs>
            </div>
        </section>
    </body>
</html>
